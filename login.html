<!DOCTYPE html>
<html>
<head>
    <title>Sub T - Log In</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 250px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 40px;
            margin: 10px 0 30px 0;
        }
        input {
            width: 260px;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        button {
            width: 286px;
            background-color: #2563eb;
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #error {
            color: #f87171;
            margin-top: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="SUB T - 16.png" class="logo">
    <h1>Log In</h1>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Log In</button>
    <div id="error"></div>
</div>

<script>
    const supabaseUrl = 'https://nygnhiaerazayvcgvrwe.supabase.co';
    const supabaseKey = 'sb_publishable_vuQJdEIU6qUhTlzuD3z1yg_Vy7eH5d9';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');
        errorDiv.textContent = '';

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            errorDiv.textContent = 'Login failed: ' + error.message;
            return;
        }

        // Look up this user's profile to check if they're admin
        const { data: profile, error: profileError } = await supabaseClient
            .from('profiles')
            .select('role, name')
            .eq('id', data.user.id)
            .single();

        if (profileError) {
            errorDiv.textContent = 'Logged in, but could not load profile.';
            return;
        }

        // Store basic info for other pages to use
        localStorageFallback('subt_user', JSON.stringify({
            id: data.user.id,
            name: profile.name,
            role: profile.role
        }));

        window.location.href = 'dashboard.html';
    }

    // Artifacts environments can't use localStorage, but a real GitHub-hosted site can.
    // This uses sessionStorage-safe fallback for real deployment.
    function localStorageFallback(key, value) {
        try {
            localStorage.setItem(key, value);
        } catch (e) {
            console.warn('Could not save session locally.');
        }
    }
</script>
</body>
</html>
