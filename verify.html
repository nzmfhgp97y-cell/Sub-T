<!DOCTYPE html>
<html>
<head>
    <title>Sub T - Verify Wins/Losses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="SUB T - 16.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        .logo {
            width: 160px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 30px;
            margin: 5px 0 20px 0;
        }
        .export-button {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
        }
        .export-button:hover {
            border-color: #2563eb;
            color: white;
        }
        .bet-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 22px;
            width: 340px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .bet-desc {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .bet-meta {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
        }
        .bet-photo {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 3px 0;
            color: #cbd5e1;
        }
        .odds-badge {
            display: inline-block;
            background: #334155;
            color: #cbd5e1;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 8px;
        }
        .verify-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn-won, .btn-lost {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-won {
            background-color: #16a34a;
            color: white;
        }
        .btn-won:hover {
            background-color: #15803d;
        }
        .btn-lost {
            background-color: #dc2626;
            color: white;
        }
        .btn-lost:hover {
            background-color: #b91c1c;
        }
        .btn-void {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background-color: #64748b;
            color: white;
        }
        .btn-void:hover {
            background-color: #475569;
        }
        .comment-input {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            resize: none;
            height: 50px;
        }
        .btn-won:disabled, .btn-lost:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .no-bets {
            color: #64748b;
            font-style: italic;
            margin-top: 20px;
        }
        .back {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
        #status {
            color: #94a3b8;
        }
        .copy-confirm {
            color: #4ade80;
            font-size: 13px;
            margin-top: -15px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
<div class="top-back-arrow" onclick="window.location.href='dashboard.html'" style="position:fixed; top:16px; left:16px; font-size:26px; color:#e2e8f0; cursor:pointer; z-index:1000; background:rgba(30,41,59,0.85); width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid #334155;">&larr;</div>
<div class="container">
    <img src="SUB T - 16.png" class="logo">
    <h1>Verify Wins/Losses</h1>

    <button class="export-button" onclick="copyForAI()">Copy All Pending Bets (for AI review)</button>
    <div class="copy-confirm" id="copyConfirm">Copied to clipboard!</div>

    <div class="section" style="background:#1e293b; border:1px solid #334155; border-radius:12px; padding:18px 22px; width:340px; box-sizing:border-box; margin-bottom:20px;">
        <div style="font-size:14px; font-weight:bold; margin-bottom:8px;">Paste AI Results</div>
        <div style="font-size:12px; color:#94a3b8; margin-bottom:10px;">Paste the AI's response here after asking it about your copied bets.</div>
        <textarea id="pasteResults" placeholder="Paste the AI's answer here..." style="width:100%; height:100px; padding:10px; border-radius:8px; border:none; font-size:14px; font-family:Arial, sans-serif; box-sizing:border-box; resize:none; margin-bottom:10px;"></textarea>
        <button onclick="parseResults()" style="width:100%; padding:12px; border-radius:8px; border:none; background-color:#2563eb; color:white; font-size:14px; font-weight:bold; cursor:pointer;">Parse Results</button>
    </div>

    <div id="reviewSection"></div>

    <div id="betsList">Loading...</div>
    <div id="status"></div>

    <div class="back" onclick="window.location.href='dashboard.html'">Back to Dashboard</div>
</div>

<script>
    const supabaseUrl = 'https://nygnhiaerazayvcgvrwe.supabase.co';
    const supabaseKey = 'sb_publishable_vuQJdEIU6qUhTlzuD3z1yg_Vy7eH5d9';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let pendingBets = [];

    function init() {
        const stored = localStorage.getItem('subt_user');
        if (!stored) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = JSON.parse(stored);

        if (currentUser.role !== 'admin') {
            window.location.href = 'dashboard.html';
            return;
        }

        loadPendingBets();
    }

    async function loadPendingBets() {
        const listDiv = document.getElementById('betsList');
        const statusDiv = document.getElementById('status');

        const { data: bets, error } = await supabaseClient
            .from('bets')
            .select('id, description, creator_id, amount, potential_win, odds, image_url, created_at, creator:profiles!bets_creator_id_fkey(name)')
            .eq('status', 'pending')
            .order('created_at', { ascending: true });

        if (error) {
            statusDiv.textContent = 'Could not load bets: ' + error.message;
            return;
        }

        pendingBets = bets || [];

        if (pendingBets.length === 0) {
            listDiv.innerHTML = '';
            statusDiv.innerHTML = '<div class="no-bets">No pending bets to verify</div>';
            return;
        }
        statusDiv.innerHTML = '';

        renderBets();
    }

    function renderBets() {
        const listDiv = document.getElementById('betsList');

        listDiv.innerHTML = pendingBets.map(bet => {
            const creatorName = bet.creator ? bet.creator.name : 'Unknown';
            const placedDate = new Date(bet.created_at).toLocaleDateString();
            const photoHtml = bet.image_url
                ? `<img src="${bet.image_url}" class="bet-photo">`
                : '';
            const oddsHtml = bet.odds
                ? `<span class="odds-badge">${bet.odds}</span>`
                : '';

            return `
                <div class="bet-card" id="bet-${bet.id}">
                    <div class="bet-desc">${bet.description}${oddsHtml}</div>
                    <div class="bet-meta">Bet by ${creatorName} &middot; Placed ${placedDate}</div>
                    ${photoHtml}
                    <div class="bet-row">
                        <span>Wager (per player)</span>
                        <span>$${Number(bet.amount).toFixed(2)}</span>
                    </div>
                    <div class="bet-row">
                        <span>Potential Win (per player)</span>
                        <span>$${bet.potential_win ? Number(bet.potential_win).toFixed(2) : Number(bet.amount).toFixed(2)}</span>
                    </div>
                    <div class="verify-buttons">
                        <button class="btn-won" onclick="resolveBet('${bet.id}', 'won')">Won</button>
                        <button class="btn-lost" onclick="resolveBet('${bet.id}', 'lost')">Lost</button>
                        <button class="btn-void" onclick="resolveBet('${bet.id}', 'void')">Tie / Void</button>
                    </div>
                    <textarea class="comment-input" id="comment-${bet.id}" placeholder="Optional comment (e.g. reason for void, source of result)"></textarea>
                </div>
            `;
        }).join('');
    }

    async function resolveBet(betId, outcome) {
        const card = document.getElementById('bet-' + betId);
        const buttons = card.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);

        const commentField = document.getElementById('comment-' + betId);
        const comment = commentField ? commentField.value.trim() : '';

        const { error } = await supabaseClient
            .from('bets')
            .update({
                status: outcome,
                resolved_by: currentUser.id,
                resolved_at: new Date().toISOString(),
                admin_comment: comment || null
            })
            .eq('id', betId);

        if (error) {
            alert('Could not update bet: ' + error.message);
            buttons.forEach(b => b.disabled = false);
            return;
        }

        // Remove from local list and re-render
        pendingBets = pendingBets.filter(b => b.id !== betId);
        renderBets();

        if (pendingBets.length === 0) {
            document.getElementById('status').innerHTML = '<div class="no-bets">No pending bets to verify</div>';
        }
    }

    function copyForAI() {
        if (pendingBets.length === 0) {
            alert('No pending bets to copy.');
            return;
        }

        let text = "I need help figuring out the results of these bets. For each one, search for the real result and tell me if it WON or LOST (or was VOID/cancelled/postponed). ";
        text += "IMPORTANT: Some of these may involve teams that played on consecutive days (like a baseball series or doubleheader) \u2014 use the exact date the bet was placed to figure out which specific game is being referenced, and assume it's the game closest to that date/time, not a later game against the same opponent.\n\n";
        text += "IMPORTANT: If a bet is a PARLAY (multiple legs/selections combined into one bet): if ANY leg has already definitively LOST, the whole parlay is LOST immediately \u2014 it doesn't matter if other legs are still in progress or unfinished. But if no leg has lost yet and at least one leg's game is still in progress or hasn't started, answer SKIP (you can't confirm a win until every leg is finished and has won). Only answer WON if every single leg has finished and hit.\n\n";
        text += "IMPORTANT: If the game/event hasn't finished yet, or you can't find a clear final result, answer SKIP for that one \u2014 do NOT guess or mark it LOST just because it's not finished. Only answer WON or LOST when you're confident the event is fully over and you know the real outcome.\n\n";
        text += "Please answer using EXACTLY this format, one line per bet, so I can paste your answer back into a tool:\n";
        text += "1: WON - brief reason\n2: LOST - brief reason\n3: SKIP - brief reason (game not finished yet)\n(etc.)\n\n";
        text += "Here are the bets:\n\n";

        pendingBets.forEach((bet, i) => {
            const creatorName = bet.creator ? bet.creator.name : 'Unknown';
            const placedDateTime = new Date(bet.created_at).toLocaleString('en-US');
            text += `${i + 1}. "${bet.description}" ${bet.odds ? '(odds: ' + bet.odds + ') ' : ''}- bet by ${creatorName}, placed ${placedDateTime}\n`;
        });

        navigator.clipboard.writeText(text).then(() => {
            const confirmDiv = document.getElementById('copyConfirm');
            confirmDiv.style.display = 'block';
            setTimeout(() => { confirmDiv.style.display = 'none'; }, 2500);
        }).catch(() => {
            alert('Could not copy automatically. Here is the text:\n\n' + text);
        });
    }

    function parseResults() {
        const rawText = document.getElementById('pasteResults').value.trim();
        const reviewDiv = document.getElementById('reviewSection');

        if (!rawText) {
            alert('Please paste the AI\'s response first.');
            return;
        }

        const lines = rawText.split('\n').filter(l => l.trim());
        const parsed = [];

        lines.forEach(line => {
            const match = line.match(/^\s*(\d+)\s*[:.]\s*(WON|LOST|VOID|CANCELLED|POSTPONED|SKIP|UNCLEAR)\b\s*[-:]?\s*(.*)$/i);
            if (match) {
                const index = parseInt(match[1]) - 1;
                let status = match[2].toUpperCase();
                if (status === 'CANCELLED' || status === 'POSTPONED') status = 'VOID';
                if (status === 'UNCLEAR') status = 'SKIP';
                const reason = match[3].trim();

                if (pendingBets[index]) {
                    parsed.push({
                        bet: pendingBets[index],
                        status: status.toLowerCase(),
                        reason: reason
                    });
                }
            }
        });

        if (parsed.length === 0) {
            reviewDiv.innerHTML = '<div style="color:#f87171; font-size:14px; margin-bottom:15px;">Could not match any lines to bets. Make sure the format looks like "1: WON - reason" and try again.</div>';
            return;
        }

        renderReview(parsed);
    }

    function renderReview(parsed) {
        const reviewDiv = document.getElementById('reviewSection');

        reviewDiv.innerHTML = `
            <div style="font-size:14px; font-weight:bold; margin-bottom:10px; width:340px;">Review Before Applying (${parsed.length} matched)</div>
            ${parsed.map((p, i) => `
                <div class="bet-card" style="width:340px;">
                    <div class="bet-desc">${p.bet.description}</div>
                    <div class="bet-meta">${p.reason || 'No reason given'}</div>
                    <select id="review-status-${i}" style="width:100%; padding:8px; border-radius:8px; border:none; font-size:14px; margin-top:6px;">
                        <option value="won" ${p.status === 'won' ? 'selected' : ''}>Won</option>
                        <option value="lost" ${p.status === 'lost' ? 'selected' : ''}>Lost</option>
                        <option value="void" ${p.status === 'void' ? 'selected' : ''}>Void/Tie</option>
                        <option value="skip" ${p.status === 'skip' ? 'selected' : ''}>Skip this one</option>
                    </select>
                </div>
            `).join('')}
            <button onclick="applyReview()" style="width:340px; padding:14px; border-radius:10px; border:none; background-color:#16a34a; color:white; font-size:16px; font-weight:bold; cursor:pointer; margin-top:5px;">Apply These Results</button>
            <div id="applyMessage" style="width:340px; text-align:center; font-size:13px; margin-top:10px;"></div>
        `;

        // Store parsed data on window so the apply button can read current dropdown selections
        window._reviewData = parsed;
    }

    async function applyReview() {
        const parsed = window._reviewData;
        const messageDiv = document.getElementById('applyMessage');
        messageDiv.textContent = 'Applying...';
        messageDiv.style.color = '#94a3b8';

        let appliedCount = 0;

        for (let i = 0; i < parsed.length; i++) {
            const select = document.getElementById('review-status-' + i);
            const status = select.value;
            if (status === 'skip') continue;

            const { error } = await supabaseClient
                .from('bets')
                .update({
                    status: status,
                    resolved_by: currentUser.id,
                    resolved_at: new Date().toISOString(),
                    admin_comment: 'AI-assisted: ' + (parsed[i].reason || '')
                })
                .eq('id', parsed[i].bet.id);

            if (!error) appliedCount++;
        }

        messageDiv.textContent = `Applied ${appliedCount} result(s) successfully.`;
        messageDiv.style.color = '#4ade80';

        document.getElementById('pasteResults').value = '';
        document.getElementById('reviewSection').innerHTML = '';
        loadPendingBets();
    }

    init();
</script>
</body>
</html>
