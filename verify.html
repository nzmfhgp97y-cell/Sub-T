<!DOCTYPE html>
<html>
<head>
    <title>Sub T - Verify Wins/Losses</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        .logo {
            width: 160px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 30px;
            margin: 5px 0 20px 0;
        }
        .export-button {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
        }
        .export-button:hover {
            border-color: #2563eb;
            color: white;
        }
        .bet-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 22px;
            width: 340px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .bet-desc {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .bet-meta {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
        }
        .bet-photo {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 3px 0;
            color: #cbd5e1;
        }
        .odds-badge {
            display: inline-block;
            background: #334155;
            color: #cbd5e1;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 8px;
        }
        .verify-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn-won, .btn-lost {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-won {
            background-color: #16a34a;
            color: white;
        }
        .btn-won:hover {
            background-color: #15803d;
        }
        .btn-lost {
            background-color: #dc2626;
            color: white;
        }
        .btn-lost:hover {
            background-color: #b91c1c;
        }
        .btn-void {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background-color: #64748b;
            color: white;
        }
        .btn-void:hover {
            background-color: #475569;
        }
        .comment-input {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            resize: none;
            height: 50px;
        }
        .btn-won:disabled, .btn-lost:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .no-bets {
            color: #64748b;
            font-style: italic;
            margin-top: 20px;
        }
        .back {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
        #status {
            color: #94a3b8;
        }
        .copy-confirm {
            color: #4ade80;
            font-size: 13px;
            margin-top: -15px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="SUB T - 16.png" class="logo">
    <h1>Verify Wins/Losses</h1>

    <button class="export-button" onclick="copyForAI()">Copy All Pending Bets (for AI review)</button>
    <div class="copy-confirm" id="copyConfirm">Copied to clipboard!</div>

    <div id="betsList">Loading...</div>
    <div id="status"></div>

    <div class="back" onclick="window.location.href='dashboard.html'">Back to Dashboard</div>
</div>

<script>
    const supabaseUrl = 'https://nygnhiaerazayvcgvrwe.supabase.co';
    const supabaseKey = 'sb_publishable_vuQJdEIU6qUhTlzuD3z1yg_Vy7eH5d9';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let pendingBets = [];

    function init() {
        const stored = localStorage.getItem('subt_user');
        if (!stored) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = JSON.parse(stored);

        if (currentUser.role !== 'admin') {
            window.location.href = 'dashboard.html';
            return;
        }

        loadPendingBets();
    }

    async function loadPendingBets() {
        const listDiv = document.getElementById('betsList');
        const statusDiv = document.getElementById('status');

        const { data: bets, error } = await supabaseClient
            .from('bets')
            .select('id, description, creator_id, amount, potential_win, odds, image_url, created_at, creator:profiles!bets_creator_id_fkey(name)')
            .eq('status', 'pending')
            .order('created_at', { ascending: true });

        if (error) {
            statusDiv.textContent = 'Could not load bets: ' + error.message;
            return;
        }

        pendingBets = bets || [];

        if (pendingBets.length === 0) {
            listDiv.innerHTML = '';
            statusDiv.innerHTML = '<div class="no-bets">No pending bets to verify</div>';
            return;
        }
        statusDiv.innerHTML = '';

        renderBets();
    }

    function renderBets() {
        const listDiv = document.getElementById('betsList');

        listDiv.innerHTML = pendingBets.map(bet => {
            const creatorName = bet.creator ? bet.creator.name : 'Unknown';
            const placedDate = new Date(bet.created_at).toLocaleDateString();
            const photoHtml = bet.image_url
                ? `<img src="${bet.image_url}" class="bet-photo">`
                : '';
            const oddsHtml = bet.odds
                ? `<span class="odds-badge">${bet.odds}</span>`
                : '';

            return `
                <div class="bet-card" id="bet-${bet.id}">
                    <div class="bet-desc">${bet.description}${oddsHtml}</div>
                    <div class="bet-meta">Bet by ${creatorName} &middot; Placed ${placedDate}</div>
                    ${photoHtml}
                    <div class="bet-row">
                        <span>Wager (per player)</span>
                        <span>$${Number(bet.amount).toFixed(2)}</span>
                    </div>
                    <div class="bet-row">
                        <span>Potential Win (per player)</span>
                        <span>$${bet.potential_win ? Number(bet.potential_win).toFixed(2) : Number(bet.amount).toFixed(2)}</span>
                    </div>
                    <div class="verify-buttons">
                        <button class="btn-won" onclick="resolveBet('${bet.id}', 'won')">Won</button>
                        <button class="btn-lost" onclick="resolveBet('${bet.id}', 'lost')">Lost</button>
                        <button class="btn-void" onclick="resolveBet('${bet.id}', 'void')">Tie / Void</button>
                    </div>
                    <textarea class="comment-input" id="comment-${bet.id}" placeholder="Optional comment (e.g. reason for void, source of result)"></textarea>
                </div>
            `;
        }).join('');
    }

    async function resolveBet(betId, outcome) {
        const card = document.getElementById('bet-' + betId);
        const buttons = card.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);

        const commentField = document.getElementById('comment-' + betId);
        const comment = commentField ? commentField.value.trim() : '';

        const { error } = await supabaseClient
            .from('bets')
            .update({
                status: outcome,
                resolved_by: currentUser.id,
                resolved_at: new Date().toISOString(),
                admin_comment: comment || null
            })
            .eq('id', betId);

        if (error) {
            alert('Could not update bet: ' + error.message);
            buttons.forEach(b => b.disabled = false);
            return;
        }

        // Remove from local list and re-render
        pendingBets = pendingBets.filter(b => b.id !== betId);
        renderBets();

        if (pendingBets.length === 0) {
            document.getElementById('status').innerHTML = '<div class="no-bets">No pending bets to verify</div>';
        }
    }

    function copyForAI() {
        if (pendingBets.length === 0) {
            alert('No pending bets to copy.');
            return;
        }

        let text = "Here are pending bets I need to verify. For each one, tell me the actual result if you know it, and whether it likely WON or LOST:\n\n";

        pendingBets.forEach((bet, i) => {
            const creatorName = bet.creator ? bet.creator.name : 'Unknown';
            const placedDate = new Date(bet.created_at).toLocaleDateString();
            text += `${i + 1}. "${bet.description}" ${bet.odds ? '(odds: ' + bet.odds + ') ' : ''}- bet by ${creatorName}, placed ${placedDate}\n`;
        });

        navigator.clipboard.writeText(text).then(() => {
            const confirmDiv = document.getElementById('copyConfirm');
            confirmDiv.style.display = 'block';
            setTimeout(() => { confirmDiv.style.display = 'none'; }, 2500);
        }).catch(() => {
            alert('Could not copy automatically. Here is the text:\n\n' + text);
        });
    }

    init();
</script>
</body>
</html>
