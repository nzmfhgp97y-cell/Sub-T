<!DOCTYPE html>
<html>
<head>
    <title>Sub T - Place a Bet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
        }
        .logo {
            width: 180px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 32px;
            margin: 5px 0 20px 0;
        }
        label {
            width: 280px;
            text-align: left;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        input, textarea {
            width: 280px;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
        textarea {
            resize: none;
            height: 60px;
        }
        button {
            width: 306px;
            background-color: #2563eb;
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .back {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
        #message {
            margin-top: 14px;
            min-height: 20px;
            font-size: 14px;
            text-align: center;
        }
        .error { color: #f87171; }
        .success { color: #4ade80; }
        .info-box {
            width: 280px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .section-label {
            width: 280px;
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 6px 0 10px 0;
            text-align: left;
        }
        .photo-upload {
            width: 280px;
            border: 2px dashed #334155;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
        }
        .photo-upload:hover {
            border-color: #2563eb;
        }
        #imagePreview {
            width: 280px;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
        }
        .remove-photo {
            width: 280px;
            text-align: center;
            color: #f87171;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="SUB T - 16.png" class="logo">
    <h1>Place a Bet</h1>

    <div class="info-box">
        This bet is automatically against the whole group. If you win, you get the amount from each other player. If you lose, you pay each other player.
    </div>

    <div class="section-label">Screenshot (optional)</div>
    <div class="photo-upload" id="uploadArea" onclick="document.getElementById('photoInput').click()">
        Tap to add a screenshot of the bet
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto()">
    <img id="imagePreview">
    <div class="remove-photo" id="removePhoto" onclick="clearPhoto()">Remove photo</div>

    <div class="section-label">Bet Details</div>

    <label for="description">What's the bet?</label>
    <textarea id="description" placeholder="e.g. Cowboys beat the Eagles Sunday"></textarea>

    <label for="amount">Amount wagered (per player)</label>
    <input type="number" id="amount" placeholder="e.g. 50" min="1" oninput="calculatePotentialWin()">

    <label for="odds">Odds (optional)</label>
    <input type="text" id="odds" placeholder="e.g. -110 or +150" oninput="calculatePotentialWin()">

    <label for="potentialWin">Potential win (auto-calculated)</label>
    <input type="number" id="potentialWin" placeholder="Auto-fills from amount + odds">

    <button id="submitBtn" onclick="submitBet()">Submit Bet</button>
    <div id="message"></div>

    <div class="back" onclick="window.location.href='dashboard.html'">Back to Dashboard</div>
</div>

<script>
    const supabaseUrl = 'https://nygnhiaerazayvcgvrwe.supabase.co';
    const supabaseKey = 'sb_publishable_vuQJdEIU6qUhTlzuD3z1yg_Vy7eH5d9';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let selectedFile = null;

    function init() {
        const stored = localStorage.getItem('subt_user');
        if (!stored) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = JSON.parse(stored);
        if (currentUser.role === 'admin') {
            window.location.href = 'dashboard.html';
            return;
        }
    }

    function previewPhoto() {
        const input = document.getElementById('photoInput');
        const file = input.files[0];
        if (!file) return;

        selectedFile = file;
        const preview = document.getElementById('imagePreview');
        const reader = new FileReader();
        reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        document.getElementById('uploadArea').style.display = 'none';
        document.getElementById('removePhoto').style.display = 'block';
    }

    function calculatePotentialWin() {
        const amountInput = document.getElementById('amount').value;
        const oddsInput = document.getElementById('odds').value.trim();
        const potentialWinField = document.getElementById('potentialWin');

        const amount = parseFloat(amountInput);
        const odds = parseFloat(oddsInput);

        if (!amount || isNaN(odds)) {
            return; // leave whatever is there (manual override) if inputs incomplete
        }

        let win;
        if (odds > 0) {
            win = amount * (odds / 100);
        } else if (odds < 0) {
            win = amount * (100 / Math.abs(odds));
        } else {
            return;
        }

        potentialWinField.value = win.toFixed(2);
    }

    function clearPhoto() {
        selectedFile = null;
        document.getElementById('photoInput').value = '';
        document.getElementById('imagePreview').style.display = 'none';
        document.getElementById('uploadArea').style.display = 'block';
        document.getElementById('removePhoto').style.display = 'none';
    }

    async function submitBet() {
        const description = document.getElementById('description').value.trim();
        const amount = document.getElementById('amount').value;
        const odds = document.getElementById('odds').value.trim();
        const potentialWin = document.getElementById('potentialWin').value;
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        messageDiv.className = '';
        messageDiv.textContent = '';

        if (!description) {
            messageDiv.textContent = 'Please describe the bet.';
            messageDiv.className = 'error';
            return;
        }
        if (!amount || Number(amount) <= 0) {
            messageDiv.textContent = 'Please enter a valid amount.';
            messageDiv.className = 'error';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        let imageUrl = null;

        if (selectedFile) {
            const fileExt = selectedFile.name.split('.').pop();
            const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;

            const { error: uploadError } = await supabaseClient
                .storage
                .from('bet-screenshots')
                .upload(fileName, selectedFile);

            if (uploadError) {
                messageDiv.textContent = 'Photo upload failed: ' + uploadError.message;
                messageDiv.className = 'error';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Bet';
                return;
            }

            const { data: publicUrlData } = supabaseClient
                .storage
                .from('bet-screenshots')
                .getPublicUrl(fileName);

            imageUrl = publicUrlData.publicUrl;
        }

        const { error } = await supabaseClient
            .from('bets')
            .insert({
                creator_id: currentUser.id,
                description: description,
                amount: Number(amount),
                status: 'pending',
                odds: odds || null,
                potential_win: potentialWin ? Number(potentialWin) : null,
                image_url: imageUrl
            });

        if (error) {
            messageDiv.textContent = 'Could not submit bet: ' + error.message;
            messageDiv.className = 'error';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Bet';
            return;
        }

        messageDiv.textContent = 'Bet submitted! Redirecting...';
        messageDiv.className = 'success';
        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 1000);
    }

    init();
</script>
</body>
</html>
