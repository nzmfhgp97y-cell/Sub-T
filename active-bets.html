<!DOCTYPE html>
<html>
<head>
    <title>Sub T - Active Bets</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }
        .logo {
            width: 160px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 30px;
            margin: 5px 0 25px 0;
        }
        .bet-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 22px;
            width: 320px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .bet-desc {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .bet-creator {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
        }
        .bet-photo {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
        }
        .label {
            color: #94a3b8;
        }
        .value {
            font-weight: bold;
        }
        .win { color: #4ade80; }
        .lose { color: #f87171; }
        .no-bets {
            color: #64748b;
            font-style: italic;
            margin-top: 20px;
        }
        .back {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
        #status {
            color: #94a3b8;
        }
        .odds-badge {
            display: inline-block;
            background: #334155;
            color: #cbd5e1;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 8px;
        }
        .summary-card {
            background: white;
            color: #1e1b4b;
            border-radius: 14px;
            padding: 18px 30px;
            display: flex;
            gap: 30px;
            margin-bottom: 25px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .summary-value {
            font-size: 24px;
            font-weight: bold;
        }
        .summary-value.win { color: #16a34a; }
        .summary-value.lose { color: #dc2626; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            border-radius: 8px;
            background: #1e293b;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #334155;
        }
        .tab.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="SUB T - 16.png" class="logo">
    <h1>Active Bets</h1>

    <div class="summary-card">
        <div class="summary-item">
            <div class="summary-label">Total At Risk</div>
            <div class="summary-value lose" id="totalRisk">--</div>
        </div>
        <div class="summary-item">
            <div class="summary-label">Total Potential Win</div>
            <div class="summary-value win" id="totalPotential">--</div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" id="tabMine" onclick="switchTab('mine')">My Bets</div>
        <div class="tab" id="tabOthers" onclick="switchTab('others')">Others' Bets</div>
    </div>

    <div id="betsList">Loading...</div>
    <div id="status"></div>

    <div class="back" onclick="window.location.href='dashboard.html'">Back to Dashboard</div>
</div>

<script>
    const supabaseUrl = 'https://nygnhiaerazayvcgvrwe.supabase.co';
    const supabaseKey = 'sb_publishable_vuQJdEIU6qUhTlzuD3z1yg_Vy7eH5d9';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let allBets = [];
    let currentTab = 'mine';

    function init() {
        const stored = localStorage.getItem('subt_user');
        if (!stored) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = JSON.parse(stored);
        loadActiveBets();
    }

    async function loadActiveBets() {
        const listDiv = document.getElementById('betsList');
        const statusDiv = document.getElementById('status');

        const { data: bets, error } = await supabaseClient
            .from('bets')
            .select('id, description, creator_id, amount, potential_win, odds, image_url, creator:profiles!bets_creator_id_fkey(name)')
            .eq('status', 'pending')
            .order('created_at', { ascending: false });

        if (error) {
            statusDiv.textContent = 'Could not load active bets: ' + error.message;
            return;
        }

        allBets = (bets || []).map(bet => {
            const amount = Number(bet.amount);
            const winAmount = bet.potential_win ? Number(bet.potential_win) : amount;
            const isCreator = bet.creator_id === currentUser.id;
            const creatorName = bet.creator ? bet.creator.name : 'Unknown';
            return {
                ...bet,
                isCreator,
                creatorName,
                youWin: isCreator ? winAmount : (amount / 2),
                youLose: isCreator ? amount : (winAmount / 2)
            };
        });

        // Summary totals across ALL active bets (both yours and others') since that's your real exposure
        const totalRisk = allBets.reduce((sum, b) => sum + b.youLose, 0);
        const totalPotential = allBets.reduce((sum, b) => sum + b.youWin, 0);
        document.getElementById('totalRisk').textContent = '$' + totalRisk.toFixed(2);
        document.getElementById('totalPotential').textContent = '$' + totalPotential.toFixed(2);

        renderTab();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabMine').classList.toggle('active', tab === 'mine');
        document.getElementById('tabOthers').classList.toggle('active', tab === 'others');
        renderTab();
    }

    function renderTab() {
        const listDiv = document.getElementById('betsList');
        const statusDiv = document.getElementById('status');

        const filtered = allBets.filter(b => currentTab === 'mine' ? b.isCreator : !b.isCreator);

        if (filtered.length === 0) {
            listDiv.innerHTML = '';
            statusDiv.innerHTML = `<div class="no-bets">${currentTab === 'mine' ? "You haven't placed any active bets" : "No active bets from others right now"}</div>`;
            return;
        }
        statusDiv.innerHTML = '';

        listDiv.innerHTML = filtered.map(bet => {
            const photoHtml = bet.image_url
                ? `<img src="${bet.image_url}" class="bet-photo">`
                : '';
            const oddsHtml = bet.odds
                ? `<span class="odds-badge">${bet.odds}</span>`
                : '';

            return `
                <div class="bet-card">
                    <div class="bet-desc">${bet.description}${oddsHtml}</div>
                    <div class="bet-creator">${bet.isCreator ? 'Your bet' : 'Bet by ' + bet.creatorName}</div>
                    ${photoHtml}
                    <div class="bet-row">
                        <span class="label">If it hits:</span>
                        <span class="value win">+$${bet.youWin.toFixed(2)}</span>
                    </div>
                    <div class="bet-row">
                        <span class="label">If it doesn't:</span>
                        <span class="value lose">-$${bet.youLose.toFixed(2)}</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    init();
</script>
</body>
</html>
