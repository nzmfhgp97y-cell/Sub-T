<!DOCTYPE html>
<html>
<head>
    <title>Sub T - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 250px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 40px;
            margin: 10px 0 10px 0;
        }
        .welcome {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .balance-card {
            background: white;
            color: #1e1b4b;
            border-radius: 16px;
            padding: 25px 50px;
            text-align: center;
            margin-bottom: 30px;
        }
        .balance-label {
            font-size: 16px;
            color: #4338ca;
            margin-bottom: 5px;
        }
        .balance-amount {
            font-size: 42px;
            font-weight: bold;
            color: #4338ca;
        }
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 260px;
        }
        .nav-button {
            background-color: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .nav-button:hover {
            background-color: #1d4ed8;
        }
        .nav-button.admin {
            background-color: #b91c1c;
        }
        .nav-button.admin:hover {
            background-color: #991b1b;
        }
        .logout {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
        #status {
            color: #94a3b8;
            margin-top: 10px;
        }
        .pending-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 24px;
            width: 300px;
            margin-bottom: 25px;
        }
        .pending-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pending-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 15px;
        }
        .pending-item:last-child {
            border-bottom: none;
        }
        .pending-swing {
            color: #94a3b8;
            font-size: 13px;
        }
        .no-pending {
            color: #64748b;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="SUB T - 16.png" class="logo">
    <h1>Sub T</h1>
    <div class="welcome" id="welcome">Loading...</div>

    <div class="balance-card">
        <div class="balance-label">Current Cycle Balance</div>
        <div class="balance-amount" id="balance">--</div>
    </div>

    <div class="balance-card" style="background: #1e293b; border: 1px solid #334155;">
        <div class="balance-label" style="color: #94a3b8;">All-Time Balance</div>
        <div class="balance-amount" id="allTimeBalance" style="color: white;">--</div>
    </div>

    <div class="nav-buttons" id="navButtons"></div>

    <div class="logout" onclick="logout()">Log Out</div>
    <div id="status"></div>
</div>

<script>
    const supabaseUrl = 'https://nygnhiaerazayvcgvrwe.supabase.co';
    const supabaseKey = 'sb_publishable_vuQJdEIU6qUhTlzuD3z1yg_Vy7eH5d9';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    const STARTING_BALANCE = 0;

    let currentUser = null;

    async function init() {
        const stored = localStorage.getItem('subt_user');
        if (!stored) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = JSON.parse(stored);
        document.getElementById('welcome').textContent = 'Welcome, ' + currentUser.name;

        // Build nav buttons based on role
        const navDiv = document.getElementById('navButtons');
        navDiv.innerHTML = `
            <a href="place-bet.html" class="nav-button">Place a Bet</a>
            <a href="active-bets.html" class="nav-button">Active Bets</a>
            <a href="history.html" class="nav-button">History</a>
        `;
        if (currentUser.role === 'admin') {
            navDiv.innerHTML += `<a href="verify.html" class="nav-button admin">Verify Wins/Losses</a>`;
            navDiv.innerHTML += `<a href="admin-tools.html" class="nav-button admin">Admin Tools</a>`;
        }

        await loadBets();
    }

    async function loadBets() {
        const statusDiv = document.getElementById('status');

        const { data: settings } = await supabaseClient
            .from('app_settings')
            .select('cycle_start')
            .eq('id', 1)
            .single();
        const cycleStart = settings ? new Date(settings.cycle_start) : new Date(0);

        const { data: bets, error } = await supabaseClient
            .from('bets')
            .select('creator_id, amount, potential_win, status, resolved_at')
            .neq('status', 'pending');

        if (error) {
            statusDiv.textContent = 'Could not load balance: ' + error.message;
            return;
        }

        const { data: adjustments, error: adjError } = await supabaseClient
            .from('adjustments')
            .select('target_user_id, amount, created_at');

        if (adjError) {
            statusDiv.textContent = 'Could not load adjustments: ' + adjError.message;
            return;
        }

        let allTimeBalance = STARTING_BALANCE;
        let cycleBalance = STARTING_BALANCE;

        for (const bet of bets) {
            const amount = Number(bet.amount);
            const winAmount = bet.potential_win ? Number(bet.potential_win) : amount;
            const isCreator = bet.creator_id === currentUser.id;
            let change = 0;

            if (bet.status === 'won') {
                change = isCreator ? winAmount : -(winAmount / 2);
            } else if (bet.status === 'lost') {
                change = isCreator ? -amount : (amount / 2);
            }

            allTimeBalance += change;
            if (bet.resolved_at && new Date(bet.resolved_at) >= cycleStart) {
                cycleBalance += change;
            }
        }

        for (const adj of adjustments) {
            const amount = Number(adj.amount);
            const isTarget = adj.target_user_id === currentUser.id;
            const change = isTarget ? amount : -(amount / 2);

            allTimeBalance += change;
            if (adj.created_at && new Date(adj.created_at) >= cycleStart) {
                cycleBalance += change;
            }
        }

        document.getElementById('balance').textContent = '$' + cycleBalance.toLocaleString();
        document.getElementById('allTimeBalance').textContent = '$' + allTimeBalance.toLocaleString();
    }

    function logout() {
        localStorage.removeItem('subt_user');
        window.location.href = 'login.html';
    }

    init();
</script>
</body>
</html>
