<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub T Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#4F2D7F;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:90%;
    max-width:450px;
    text-align:center;
}

.logo{
    width:220px;
    margin-bottom:20px;
}

h1{
    margin-bottom:30px;
    font-size:42px;
}

.balance-card{
    background:white;
    color:#4F2D7F;
    border-radius:15px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.balance-label{
    font-size:16px;
    margin-bottom:10px;
}

.balance{
    font-size:36px;
    font-weight:bold;
}

.button{
    display:block;
    width:100%;
    background:white;
    color:#4F2D7F;
    text-decoration:none;
    padding:18px;
    margin:15px 0;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
    transition:.2s;
}

.button:hover{
    background:#D9D9DD;
    transform:translateY(-2px);
}
</style>

</head>
<body>

<div class="container">

    <img src="SUB T - 16.png" class="logo">

    <h1>Sub T</h1>

    <div class="balance-card">
        <div class="balance-label">Current Balance</div>
        <div class="balance">$1,000</div>
    </div>

    <a� Active Bets</a>

    #📊 Account Summary</a>

</div>

</body>
</html>
